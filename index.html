<!DOCTYPE html>
<html lang="es">
<head>

<style>
/* =====================================
   PALETA DE COLORES
===================================== */
:root {
    --rosa-principal: #C98796;
    --rosa-oscuro: #A96576;
    --rosa-suave: #F3DDE2;
    --rosa-claro: #FFF5F7;
    --rosa-borde: #E8C4CC;
    --texto: #59464A;
    --texto-suave: #92777D;
    --blanco: #FFFFFF;
    --verde-whatsapp: #25D366;
    --rojo-stock: #D97983;
}

/* =====================================
   CONFIGURACIÓN GENERAL
===================================== */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--rosa-claro);
    color: var(--texto);
}

/* =====================================
   ENCABEZADO / BANNER
===================================== */
header {
    width: 100%;
    overflow: hidden;
    padding: 0;
    background: var(--rosa-suave);
}

header img {
    display: block;
    width: 100%;
    height: auto;
}

/* =====================================
   HERRAMIENTAS DEL CATÁLOGO
===================================== */
.catalog-tools {
    max-width: 1200px;
    margin: 30px auto 0;
    padding: 0 20px;
}

.search-wrap {
    max-width: 520px;
    margin: 0 auto 20px;
}

#productSearch {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid var(--rosa-borde);
    border-radius: 14px;
    background: var(--blanco);
    color: var(--texto);
    font-size: 16px;
    outline: none;
    transition: .2s;
}

#productSearch::placeholder {
    color: #B69BA1;
}

#productSearch:focus {
    border-color: var(--rosa-principal);
    box-shadow: 0 0 0 3px rgba(201, 135, 150, .18);
}

/* =====================================
   BOTONES DE CATEGORÍA
===================================== */
.category-nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

.category-btn {
    border: 1px solid var(--rosa-borde);
    background: var(--blanco);
    color: var(--rosa-oscuro);
    padding: 10px 18px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

.category-btn:hover,
.category-btn.active {
    background: var(--rosa-principal);
    border-color: var(--rosa-principal);
    color: var(--blanco);
}

.product-count {
    text-align: center;
    color: var(--texto-suave);
    font-size: 14px;
    margin: 16px 0 0;
}

/* =====================================
   CONTENEDOR DE PRODUCTOS
===================================== */
.products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 40px 20px;
}

/* =====================================
   TARJETAS DE PRODUCTOS
===================================== */
.card {
    position: relative;
    background: var(--blanco);
    width: 320px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(232, 196, 204, .55);
    box-shadow: 0 5px 18px rgba(169, 101, 118, .10);
    transition: transform .25s, box-shadow .25s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 9px 24px rgba(169, 101, 118, .16);
}

.card img {
    width: 100%;
    height: 280px;
    object-fit: contain;
    background: #FFFAFB;
}

.card-content {
    padding: 20px;
    text-align: center;
}

.card h3 {
    margin: 0;
    color: var(--texto);
    font-size: 18px;
}

.price {
    font-size: 30px;
    font-weight: bold;
    color: var(--rosa-oscuro);
    margin: 15px 0;
}

/* =====================================
   SELECTORES DE TALLA Y COLOR
===================================== */
.variant-group {
    text-align: left;
    margin: 14px 0;
}

.variant-group label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
    color: var(--rosa-oscuro);
}

.variant-group select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--rosa-borde);
    border-radius: 10px;
    background: var(--blanco);
    color: var(--texto);
    font-size: 15px;
    outline: none;
    cursor: pointer;
    transition: .2s;
}

.variant-group select:focus {
    border-color: var(--rosa-principal);
    box-shadow: 0 0 0 3px rgba(201, 135, 150, .15);
}

/* =====================================
   BOTONES GENERALES
===================================== */
.btn {
    border: none;
    background: var(--rosa-principal);
    color: var(--blanco);
    padding: 12px 25px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}

.btn:hover {
    background: var(--rosa-oscuro);
    transform: translateY(-1px);
}

.card .btn:disabled {
    background: #CFC4C7;
    cursor: not-allowed;
    opacity: 1;
    transform: none;
}

/* =====================================
   PRODUCTOS AGOTADOS
===================================== */
.stock-badge {
    display: inline-block;
    background: var(--rojo-stock);
    color: var(--blanco);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: .5px;
    padding: 7px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
}

.card.is-unavailable img {
    opacity: .55;
}

/* =====================================
   MENSAJE SIN RESULTADOS
===================================== */
.no-results {
    width: 100%;
    text-align: center;
    color: var(--texto-suave);
    padding: 35px 15px;
    font-size: 17px;
}

/* =====================================
   CARRITO DE COMPRAS
===================================== */
.cart {
    background: var(--blanco);
    max-width: 800px;
    margin: 20px auto 50px;
    padding: 25px;
    border-radius: 20px;
    border: 1px solid rgba(232, 196, 204, .55);
    box-shadow: 0 5px 18px rgba(169, 101, 118, .10);
}

.cart h2 {
    margin-top: 0;
    color: var(--rosa-oscuro);
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #F2E5E8;
    padding: 12px 0;
    color: var(--texto);
}

.remove {
    background: #D97983;
    color: var(--blanco);
    border: none;
    border-radius: 8px;
    padding: 7px 11px;
    cursor: pointer;
    transition: .2s;
}

.remove:hover {
    background: #BD5967;
}

.total {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
    color: var(--rosa-oscuro);
}

.empty {
    color: var(--texto-suave);
}

/* =====================================
   BOTÓN DE WHATSAPP
===================================== */
.whatsapp-btn {
    margin-top: 20px;
    display: inline-block;
    background: var(--verde-whatsapp);
    color: var(--blanco);
    text-decoration: none;
    padding: 15px 25px;
    border-radius: 12px;
    font-weight: bold;
    transition: .2s;
}

.whatsapp-btn:hover {
    background: #1EAD55;
    transform: translateY(-2px);
}

/* =====================================
   DISEÑO RESPONSIVE
===================================== */
@media (max-width: 600px) {

    .catalog-tools {
        padding: 0 14px;
    }

    .products {
        gap: 18px;
        padding: 25px 12px;
    }

    .card {
        width: 100%;
        max-width: 360px;
    }

    .category-nav {
        justify-content: flex-start;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 3px 2px 10px;
        scrollbar-width: thin;
    }

    .category-btn {
        flex: 0 0 auto;
    }

    .cart {
        margin: 20px 12px 35px;
        padding: 20px 15px;
    }

    .cart-item {
        align-items: flex-start;
    }

    .total {
        font-size: 22px;
    }
}
</style>
    
</head>


    
<body>

<header>
    <img
        src="banner-accesorios.png"
        alt="Concept by Lily - Skincare, maquillaje y accesorios"

<!-- Los productos se administran desde el arreglo products del script. -->
<section class="catalog-tools">

        <input

            placeholder="Buscar productos..."

<!-- Las tarjetas se generan automáticamente desde el arreglo products. -->
<section class="products" id="productsContainer" aria-live="polite"></section>

<section class="cart">

    <div id="cartItems">

<button
    id="whatsappBtn"
    class="whatsapp-btn"
    onclick="generateInvoice()"
>
    Finalizar pedido
</button>


</section>

display:none;

left:0;
width:100%;

background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;
z-index:9999;

<div style="
background:white;
padding:20px;

max-height:90vh;
overflow:auto;

<div id="invoiceArea"></div>

<br>

<button class="btn" onclick="shareInvoice()">
💖 Enviar Pedido

Cerrar

<script>
/*
    CATÁLOGO DE PRODUCTOS
    Para agregar un producto, copia un objeto y modifica sus datos.
    Para marcarlo agotado, cambia available: true por available: false.
*/
const products = [
    /*Camisas*/
    {
        name: "Camisa Casual Cherry prints",
        price: 1000,
        image: "camisa-casual-blanco-cherry-print-m.jpg",

    {

    /*Bolsos y Carteras*/

        colors: ["Negro", "Rojo", "Beige", "Burgundi"],
        colorImages: {

            "Rojo": "cartera-monedero-rojo.jpg",

        }
    },
    {

        price: 1000,

    },
    {
        name: "Bolso Mediano",
        price: 1000,
        image: "bolso-mediano-negro.jpg",
        category: "bags",
        available: true,
        colors: ["Negro"]
    },
    {
        name: "Bolso Y Crossbody",
        price: 1000,
        image: "bolso-crossbody-cafe.jpg",
        category: "bags",
        available: true,
        colors: ["Café"]
    },
    {
        name: "Crossbody",
        price: 1000,
        image: "crossbody-cafe.jpg",
        category: "bags",
        available: true,
        colors: ["Café"]
    },
    {
        name: "Mochila Mediana",
        price: 1000,
        image: "mochla-mediana-negro.jpg",
        category: "bags",
        available: true,
        colors: ["Negro", "Café"],
        colorImages: {
            "Negro": "mochla-mediana-negro.jpg",
            "Café": "mochla-mediana-cafe.jpg"
        }
    },

    /*Conjuntos y Vestidos*/
    {
        name: "Conjunto de Pijama",
        price: 1000,
        image: "conjunto-pijama-burdeos-m.jpg",
        category: "conjuntos",
        available: true,
        sizes: ["M"],
        colors: ["Burdeos"]
    },
    {
        name: "Conjunto de Pijama Satin",
        price: 1000,
        image: "conjunto-pijama-satin-verde-olivo-m.jpg",
        category: "conjuntos",
        available: true,
        sizes: ["M"],
        colors: ["Verde Olivo"]
    },
    {
        name: "Vestido Largo",
        price: 1000,
        image: "vestido-largo-cafe-m.jpg",
        category: "conjuntos",
        available: true,
        sizes: ["M"],
        colors: ["Café"]
    },

    /*Accesorios*/
    {
        name: "Estuche Silicona",
        price: 1000,
        image: "estuche-silicona-rosa.jpg",
        category: "accessories",
        available: true,
        colors: ["Rosa","Morado","Azul Cielo"],
        colorImages: {
            "Rosa": "estuche-silicona-rosa.jpg",
            "Morado": "estuche-silicona-morado.jpg",
            "Azul Cielo": "estuche-silicona-azul-cielo.jpg",
        }
    }
];

let activeCategory = "all";
let cart = {};
let lastInvoiceImage = null;

const productsContainer = document.getElementById("productsContainer");
const searchInput = document.getElementById("productSearch");
const productCount = document.getElementById("productCount");

/* Normaliza el texto para que la búsqueda no dependa de mayúsculas o tildes. */
function normalizeText(value) {
    return String(value)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLocaleLowerCase("es")
        .trim();
}

/* Dibuja las tarjetas a partir del arreglo products. */

function renderVariantSelectors(product, index) {
    let html = "";

    if (product.sizes?.length) {
        html += `
            <div class="variant-group">
                <label for="size-${index}">Talla</label>
                <select id="size-${index}" data-size-select>
                    <option value="">Selecciona una talla</option>
                    ${product.sizes.map(size => `
                        <option value="${size}">${size}</option>
                    `).join("")}
                </select>
            </div>
        `;
    }

    if (product.colors?.length) {
        html += `
            <div class="variant-group">
                <label for="color-${index}">Color</label>
                <select id="color-${index}" data-color-select>
                    <option value="">Selecciona un color</option>
                    ${product.colors.map(color => `
                        <option value="${color}">${color}</option>
                    `).join("")}
                </select>
            </div>
        `;
    }

    return html;
}
    
function renderProducts() {
    const search = normalizeText(searchInput.value);

    const filteredProducts = products
        .map((product, index) => ({ ...product, index }))
        .filter(product => {
            const categoryMatches =
                activeCategory === "all" ||
                product.category === activeCategory;

            const searchMatches =
                normalizeText(product.name).includes(search);

            return categoryMatches && searchMatches;
        });

    productCount.textContent =
        `${filteredProducts.length} ${
            filteredProducts.length === 1 ? "producto" : "productos"
        }`;

    if (filteredProducts.length === 0) {
        productsContainer.innerHTML =
            '<p class="no-results">No se encontraron productos.</p>';
        return;
    }

    productsContainer.innerHTML = filteredProducts.map(product => {
        const unavailable = !product.available;

        return `
            <article
                class="card ${unavailable ? "is-unavailable" : ""}"
                data-card-index="${product.index}"
            >
                <img
                    src="${escapeHTML(product.image)}"
                    alt="${escapeHTML(product.name)}"
                    loading="lazy"
                    data-product-image
                >

                <div class="card-content">
                    ${unavailable
                        ? '<span class="stock-badge">AGOTADO</span>'
                        : ''
                    }

                    <h3>${escapeHTML(product.name)}</h3>

                    <div class="price">
                        C$ ${formatNumber(product.price)}
                    </div>

                    ${renderVariantSelectors(product, product.index)}

                    <button
                        class="btn"
                        type="button"
                        data-product-index="${product.index}"
                        ${unavailable ? "disabled" : ""}
                    >
                        ${unavailable ? "Agotado" : "Añadir al carrito"}
                    </button>
                </div>
            </article>
        `;
    }).join("");

    productsContainer.querySelectorAll("[data-product-index]").forEach(button => {
        button.addEventListener("click", () => {
            const index = Number(button.dataset.productIndex);
            addProductToCart(index);
        });
    });
    // Cambiar imagen según el color seleccionado
    productsContainer.querySelectorAll("[data-color-select]").forEach(select => {

        select.addEventListener("change", () => {
    
            const card = select.closest("[data-card-index]");
    
            const index = Number(card.dataset.cardIndex);
    
            const product = products[index];
    
            const image = card.querySelector("[data-product-image]");
    
            const selectedColor = select.value;
    
            if (product.colorImages && product.colorImages[selectedColor]) {
    
                image.src = product.colorImages[selectedColor];
    
            } else {
    
                image.src = product.image;
    
            }
    
        });

    });
}

/* Evita que nombres o imágenes introduzcan HTML accidentalmente. */
function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function formatNumber(value) {
    return Number(value).toLocaleString("es-NI");
}

/* Filtros por categoría. */
document.querySelectorAll(".category-btn").forEach(button => {
    button.addEventListener("click", () => {
        activeCategory = button.dataset.filter;

        document.querySelectorAll(".category-btn").forEach(item => {
            item.classList.toggle("active", item === button);
        });

        renderProducts();
    });
});

/* Búsqueda instantánea. */
searchInput.addEventListener("input", renderProducts);

/* Añade al carrito usando el índice del producto en el catálogo. */
function addProductToCart(index) {

    const product = products[index];

    if (!product || !product.available) {
        return;
    }

    const card = productsContainer.querySelector(
        `[data-card-index="${index}"]`
    );

    if (!card) return;

    const sizeSelect = card.querySelector("[data-size-select]");
    const colorSelect = card.querySelector("[data-color-select]");

    const selectedSize = sizeSelect ? sizeSelect.value : "";
    const selectedColor = colorSelect ? colorSelect.value : "";

    if (sizeSelect && !selectedSize) {
        alert("Selecciona una talla.");
        return;
    }

    if (colorSelect && !selectedColor) {
        alert("Selecciona un color.");
        return;
    }

    addToCart(product, selectedSize, selectedColor);
}

function makeCartKey(product, size, color) {
    return JSON.stringify([
        product.name,
        size || "",
        color || ""
    ]);
}

function addToCart(product, size = "", color = "") {

    const key = makeCartKey(product, size, color);

    if (cart[key]) {
        cart[key].quantity++;
    } else {
        cart[key] = {
            name: product.name,
            price: product.price,
            size: size,
            color: color,
            quantity: 1
        };
    }

    renderCart();
}

function removeFromCart(key) {

    if (!cart[key]) return;

    if (cart[key].quantity > 1) {
        cart[key].quantity--;
    } else {
        delete cart[key];
    }

    renderCart();
}

function renderCart() {
    const container = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");
    const keys = Object.keys(cart);

    if (keys.length === 0) {
        container.innerHTML =
            '<p class="empty">No hay productos en el carrito.</p>';

        totalElement.innerText = "Total: C$ 0";
        return;
    }

    let total = 0;

    container.innerHTML = keys.map(key => {
        const item = cart[key];
        const subtotal = item.quantity * item.price;

        total += subtotal;

        return `
            <div class="cart-item">
                <div>
                    <strong>${escapeHTML(item.name)}</strong>
                    <br>

                    ${item.size
                        ? `Talla: ${escapeHTML(item.size)}<br>`
                        : ""
                    }

                    ${item.color
                        ? `Color: ${escapeHTML(item.color)}<br>`
                        : ""
                    }

                    Cantidad: ${item.quantity}
                    <br>

                    Subtotal: C$ ${formatNumber(subtotal)}
                </div>

                <button
                    class="remove"
                    type="button"
                    data-remove-product="${escapeHTML(key)}"
                >
                    Eliminar
                </button>
            </div>
        `;
    }).join("");

    container.querySelectorAll("[data-remove-product]").forEach(button => {
        button.addEventListener("click", () => {
            removeFromCart(button.dataset.removeProduct);
        });
    });

    totalElement.innerText = `Total: C$ ${formatNumber(total)}`;
}
function generateInvoice() {
    const keys = Object.keys(cart);

    if (keys.length === 0) {
        alert("Agrega productos al carrito primero.");
        return;
    }

    let total = 0;

    let html = `
        <div style="
            background:white;
            padding:20px;
            color:#444;
            font-family:Arial;
        ">
            <h2 style="text-align:center;">
                Concept by Lily 💖
            </h2>

            <p style="
                text-align:center;
                font-size:18px;
                margin:5px 0;
            ">
                📱 WhatsApp: +505 8798 4118
            </p>

            <p style="text-align:center;">
                Proforma de Pedido
            </p>

            <hr>
    `;

    keys.forEach(productName => {
        const item = cart[productName];
        const subtotal = item.price * item.quantity;
        total += subtotal;

        html += `
            <p>
                ✅ ${escapeHTML(item.name)}
                <br>
        
                ${item.size
                    ? `Talla: ${escapeHTML(item.size)}<br>`
                    : ""
                }
        
                ${item.color
                    ? `Color: ${escapeHTML(item.color)}<br>`
                    : ""
                }
        
                Cantidad: ${item.quantity}
                <br>
        
                Subtotal: C$ ${formatNumber(subtotal)}
            </p>
        `;
    });

    html += `
            <hr>

            <h2>
                Total: C$ ${formatNumber(total)}
            </h2>

            <p>
                Gracias por elegir
                Concept by Lily 💖
            </p>
        </div>
    `;

    document.getElementById("invoiceArea").innerHTML = html;
    document.getElementById("invoiceModal").style.display = "flex";
}

function closeInvoice() {
    document.getElementById("invoiceModal").style.display = "none";
}

async function shareInvoice() {
    try {
        const invoiceArea = document.getElementById("invoiceArea");

        const canvas = await html2canvas(invoiceArea);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

        if (!blob) {
            throw new Error("No se pudo generar la imagen del pedido.");
        }

        const file = new File(
            [blob],
            "Pedido-Concept-by-Lily.png",
            { type: "image/png" }
        );

        if (
            navigator.canShare &&
            navigator.canShare({ files: [file] }) &&
            navigator.share
        ) {
            await navigator.share({
                files: [file],
                title: "Pedido Concept by Lily",
                text: "Hola 💖, me gustaría realizar este pedido."
            });
        } else {
            /* Alternativa para navegadores que no permiten compartir archivos. */
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Pedido-Concept-by-Lily.png";
            link.click();
            URL.revokeObjectURL(link.href);

            alert("La imagen del pedido se descargó. Puedes adjuntarla en WhatsApp.");
        }
    } catch (error) {
        console.error(error);
        alert("No fue posible compartir el pedido.");
    }
}

renderProducts();
renderCart();

console.log("Concept by Lily: catálogo dinámico cargado.");
